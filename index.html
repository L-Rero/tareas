<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Tareas de casa</title>
<meta name="description" content="Reparto de las tareas del hogar con puntos y premios, con datos cifrados.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tareas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="tareas.css">
</head>
<body>
<div id="setup" hidden></div>
<div id="app" hidden>
  <div class="nav"><span id="syncw"></span><span id="navR"></span></div>
  <main id="m"></main>
  <div id="bbar" hidden></div>
  <nav class="tabbar">
    <button data-t="resumen" onclick="go('resumen')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4.5C4.5 8.5 5.6 10.4 7.4 10.8M17 6h2.5c0 2.5-1.1 4.4-2.9 4.8"/><path d="M12 13v3.5M8.5 20h7M9.5 16.5h5V20h-5z"/></svg>Resumen</button>
    <button data-t="registrar" onclick="go('registrar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7L16.2 9.5"/></svg>Registrar</button>
    <button data-t="puntos" onclick="go('puntos')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6h10M9.5 12h10M9.5 18h10"/><circle cx="5" cy="6" r="1.2"/><circle cx="5" cy="12" r="1.2"/><circle cx="5" cy="18" r="1.2"/></svg>Puntos</button>
    <button data-t="premios" onclick="go('premios')"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8C10.5 5 7 4.5 7 6.5S10 8 12 8Zm0 0c1.5-3 5-3.5 5-1.5S14 8 12 8Z"/></svg><span id="badge" class="badge" hidden></span></span>Premios</button>
    <button data-t="perfiles" onclick="go('perfiles')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.3"/><path d="M3 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="16.8" cy="9" r="2.6"/><path d="M16.5 14c2.7 0 4.5 1.8 4.5 4.6"/></svg>Perfiles</button>
  </nav>
</div>
<div id="ts" class="ts" hidden></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/crypto.js"></script>
<script src="js/common.js"></script>
<script src="js/logica.js"></script>
<script src="js/datos.js"></script>
<script src="js/sync.js"></script>
<script src="js/vistas.js"></script>
<script src="js/setup.js"></script>
<script>
window.addEventListener('error', e => { try { toast('Error: ' + (e.message || 'desconocido'), 6000); } catch (x) {} });
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // Cuando se instala una versión nueva, la app se recarga sola una vez para usarla
  let recargada = false;
  if (navigator.serviceWorker.controller) navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recargada) { recargada = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r => {
    r.addEventListener('updatefound', () => { const w = r.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Hay una versión nueva. Cierra y vuelve a abrir la app para usarla.', 8000); }); });
  }).catch(() => {});
}
</script>
</body>
</html>
